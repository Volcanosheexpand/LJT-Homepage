name: Check Perms

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const perms = await github.request('GET /repos/{owner}/{repo}/actions/permissions', { owner, repo });
              console.log('Actions permissions: ' + JSON.stringify(perms.data));
            } catch (e) {
              console.log('Get actions perms failed: ' + e.message);
            }
            try {
              const wf = await github.request('GET /repos/{owner}/{repo}/actions/permissions/workflow', { owner, repo });
              console.log('Workflow permissions: ' + JSON.stringify(wf.data));
            } catch (e) {
              console.log('Get workflow perms failed: ' + e.message);
            }
