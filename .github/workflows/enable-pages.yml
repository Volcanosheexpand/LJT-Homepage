name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Try workflow build type first
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner, repo,
                build_type: 'workflow'
              });
              console.log('Created with workflow build type');
              return;
            } catch (e) {
              console.log('Workflow build type failed: ' + e.message);
            }
            // Try legacy branch source
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner, repo,
                source: { branch: 'master', path: '/' }
              });
              console.log('Created with legacy branch source');
            } catch (e) {
              console.log('Legacy source failed: ' + e.message);
            }
            // Check current status
            try {
              const res = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
              console.log('Pages status: ' + JSON.stringify(res.data));
            } catch (e) {
              console.log('Get pages failed: ' + e.message);
            }
